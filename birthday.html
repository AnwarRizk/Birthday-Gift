<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/default-image.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Happy Birthday!</title>
  <meta name="description" content="A special birthday message awaits you!" />
</head>
<body>
  <canvas id="fireworksCanvas"></canvas>
  <div class="glow-particles" id="glowParticles"></div>
  <div class="sparkles" id="sparkles"></div>

  <div id="header">
    <div class="celebration-badge">
      <i class="fas fa-birthday-cake"></i>
      <span>Special Birthday Surprise</span>
    </div>

    <h1 id="happyBirthday"></h1>

    <div class="floating-icons">
      <span>🎂</span>
      <span>🎈</span>
      <span>🎁</span>
    </div>

    <div class="image-container">
      <div class="image-decoration"></div>
      <img src="" id="birthdayImage" alt="Birthday person's photo" />
    </div>

    <div class="message-card">
      <p id="birthdayMessage"></p>
    </div>

    <div class="from-section">
      <p class="from-label">With love from</p>
      <p class="from-sender"><span class="sender"></span></p>
    </div>

    <div class="cta-section">
      <a href="https://friend-birthday-gift.vercel.app/" target="_blank" class="cta-badge">
        <i class="fas fa-magic"></i>
        Create Your Own Birthday Gift
      </a>
    </div>
  </div>

  <footer class="copyright">
    <p>&copy; 2024 - Made with <i class="fas fa-heart" style="color: #ff6b95;"></i> by <a href="https://github.com/AnwarRizk" target="_blank">Anwar Rizk</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
