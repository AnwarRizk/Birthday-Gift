<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="homeStyle.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Birthday Gift - Create Special Birthday Wishes</title>
    <meta
      name="description"
      content="Create and share beautiful personalized birthday gift pages for your friends and loved ones"
    />
  </head>
  <body>
    <div class="confetti-container" id="confettiContainer"></div>
    <div class="balloons" id="balloonsContainer"></div>

    <div class="main-container">
      <header class="header">
        <div class="header-icon">🎁</div>
        <h1>Birthday Gift</h1>
        <p>Create magical birthday memories</p>
      </header>

      <form class="form-container" id="birthdayForm">
        <div class="input-section">
          <div class="input-group">
            <label for="friendName">
              <i class="fas fa-heart"></i>Friend's Name
            </label>
            <input
              type="text"
              name="friendName"
              id="friendName"
              placeholder="Enter your friend's name"
              maxlength="30"
              required
            />
          </div>

          <div class="input-group">
            <label>
              <i class="fas fa-image"></i>Friend's Photo (Optional)
            </label>
            <div class="file-upload">
              <label for="friendImage">
                <i class="fas fa-upload"></i>Choose Image
              </label>
              <input
                type="file"
                name="friendImage"
                id="friendImage"
                accept="image/*"
              />
              <span class="file-name" id="fileName"></span>
            </div>
          </div>

          <div class="input-group">
            <label for="message">
              <i class="fas fa-envelope"></i>Birthday Message
            </label>
            <textarea name="message" id="message" maxlength="1000" required>
I wish you a year full of joy, happiness, and success. May all your wishes come true. Happy Birthday! </textarea
            >
          </div>

          <div class="suggest-btn-wrapper">
            <button type="button" class="suggest-btn" id="suggestMessageBtn">
              <i class="fas fa-magic"></i>Surprise Me with a Message
            </button>
          </div>

          <div class="input-group">
            <label for="senderName">
              <i class="fas fa-user"></i>Your Name
            </label>
            <input
              type="text"
              name="senderName"
              id="senderName"
              placeholder="Enter your name"
              maxlength="30"
              required
            />
          </div>
        </div>

        <button type="submit" class="submit-btn" id="generateBtn">
          <i class="fas fa-rocket"></i>Generate Magic Link
        </button>

        <div class="result-container" id="generatedLinkContainer">
          <div class="share-card">
            <h3 class="share-title">
              <i class="fas fa-gift"></i>
              Share the Magic
            </h3>
            <input
              type="text"
              id="generatedLink"
              class="result-link"
              readonly
            />
            <span class="expire-badge">
              <i class="fas fa-clock"></i>Link expires in 3 days
            </span>
            <div class="button-group">
              <button
                type="button"
                class="action-btn copy-btn"
                id="copyLinkButton"
              >
                <i class="fas fa-copy"></i>Copy Link
              </button>
              <button
                type="button"
                class="action-btn visit-btn"
                id="visitLinkButton"
              >
                <i class="fas fa-eye"></i>Preview
              </button>
              <button
                type="button"
                class="action-btn whatsapp-btn"
                id="whatsappShare"
              >
                <i class="fab fa-whatsapp"></i>WhatsApp
              </button>
            </div>
          </div>
        </div>
      </form>

      <footer class="footer">
        <p>
          Made with <i class="fas fa-heart" style="color: #ff6b95"></i> by
          <a href="https://github.com/AnwarRizk" target="_blank">Anwar Rizk</a>
        </p>
      </footer>
    </div>

    <script src="homeScript.js"></script>
    <script>
      function createConfetti() {
        const container = document.getElementById('confettiContainer');
        const colors = [
          '#ff6b95',
          '#845ec2',
          '#ffc75f',
          '#25d366',
          '#ff9f43',
          '#00c9a7',
        ];

        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDuration = Math.random() * 10 + 10 + 's';
          confetti.style.animationDelay = Math.random() * 10 + 's';
          confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
          container.appendChild(confetti);
        }
      }

      function createBalloons() {
        const container = document.getElementById('balloonsContainer');
        const colors = ['#ff6b95', '#845ec2', '#ffc75f', '#00c9a7', '#ff9f43'];

        for (let i = 0; i < 8; i++) {
          const balloon = document.createElement('div');
          balloon.className = 'balloon';
          balloon.style.left = i * 12 + 5 + '%';
          balloon.style.backgroundColor = colors[i % colors.length];
          balloon.style.animationDuration = Math.random() * 10 + 15 + 's';
          balloon.style.animationDelay = Math.random() * 15 + 's';
          container.appendChild(balloon);
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        createConfetti();
        createBalloons();
      });
    </script>
  </body>
</html>
